name: Build
on:
  push:
    paths:
      - '**.4dm'
  pull_request:
    paths:
      - '**.4dm'
  workflow_dispatch:

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Check out Hero
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/Hero
        path: Components/Hero.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out 2048
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/2048
        path: Components/2048.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out MathQuiz
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/MathQuiz
        path: Components/MathQuiz.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out PatternQuiz
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/PatternQuiz
        path: Components/PatternQuiz.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out LetterDetective
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/LetterDetective
        path: Components/LetterDetective.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out LetterMemory
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/LetterMemory
        path: Components/LetterMemory.4dbase
        ref: main
        fetch-depth: 0
    - name: Build
      uses: 4d/build4d-action@main
